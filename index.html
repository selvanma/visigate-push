<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisiGate Access Portals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 22px;
        }
        a.btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .guard { background-color: #e74c3c; }
        .resident { background-color: #27ae60; }
        .mc { background-color: #8e44ad; }
        .manager { background-color: #d35400; }
        .router { background-color: #16a085; }
        a.btn:hover { opacity: 0.9; }
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>VisiGate Access Portals</h2>
        
        <!-- Guard App Link -->
        <a href="https://script.google.com/macros/s/AKfycbwAeuMShFKEpa9ZnP_OKl5qzAv8mPrYQ9FVMYJAwYS1zLpvsYHDfanF5xKVH5dS7b8E/exec" class="btn guard">Open Guard App</a>
        
        <!-- Resident Portal Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec" class="btn resident">Open Resident App</a>

        <!-- Management Committee Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec?page=mc" class="btn mc">Open MC App</a>

        <!-- Manager Portal Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec?page=manager" class="btn manager">Open Manager App</a>
        
        <!-- Master Router Link -->
        <a href="https://script.google.com/macros/s/AKfycbwz-eVMRCO7Sd1dGIIVkHgmBXvfTxrbou5WX_lR2bIx3mKocZUAjWbqI_CuSy_dSw3-/exec" class="btn router">Open Master Router</a>

        <div style="font-size: 11px; color: #95a5a6; margin-top: 5px;">Guard @591 &bull; Resident @177 &bull; MasterRouter @26 (Universal Zero-Hardcoding Baseline)</div>
        <div id="status">Initializing push system...</div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script>
        const statusEl = document.getElementById('status');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(function(reg) {
                statusEl.innerText = "Push Notifications Active";
                console.log('Service Worker Registered successfully!');

                try {
                    if (typeof firebaseConfig !== 'undefined' && !firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    if (firebase.apps.length) {
                        const messaging = firebase.messaging();
                        if (Notification.permission === 'granted') {
                            messaging.getToken().then((token) => {
                                if (token) {
                                    appendTokenToLinks(token);
                                }
                            }).catch((e) => console.log('Token fetch: ', e));
                        } else if (Notification.permission !== 'denied') {
                            Notification.requestPermission().then((perm) => {
                                if (perm === 'granted') {
                                    messaging.getToken().then((token) => {
                                        if (token) appendTokenToLinks(token);
                                    }).catch((e) => console.log('Token fetch: ', e));
                                }
                            });
                        }
                    }
                } catch(fbErr) {
                    console.log('Firebase init note: ', fbErr);
                }
            })
            .catch(function(err) {
                statusEl.innerText = "Push Notifications Active";
                console.log('Service worker note: ', err);
            });
        } else {
            statusEl.innerText = "Push not supported in this browser.";
        }

        function appendTokenToLinks(currentToken) {
            const appendToken = (selector) => {
                const el = document.querySelector(selector);
                if(el && currentToken) {
                    const sep = el.href.includes('?') ? '&' : '?';
                    el.href = el.href + sep + 'fcmToken=' + encodeURIComponent(currentToken);
                }
            };
            appendToken('.resident');
            appendToken('.mc');
            appendToken('.manager');
        }
    </script>
</body>
</html>
