<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiGate Portals</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
        }
        a.btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        a.btn.guard { background-color: #e74c3c; }
        a.btn.resident { background-color: #27ae60; }
        a.btn.router { background-color: #16a085; }
        a.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VisiGate Access Portals</h2>
        
        <!-- Guard App Link -->
        <a href="https://script.google.com/macros/s/AKfycbwAeuMShFKEpa9ZnP_OKl5qzAv8mPrYQ9FVMYJAwYS1zLpvsYHDfanF5xKVH5dS7b8E/exec" class="btn guard">Open Guard App</a>
        
        <!-- Resident Portal Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec" class="btn resident">Open Resident App</a>

        <!-- Management Committee Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec?page=mc" class="btn mc" style="background-color: #8e44ad;">Open MC App</a>

        <!-- Manager Portal Link -->
        <a href="https://script.google.com/macros/s/AKfycbyLY_FQdqqZa9ZpoVTXbzJppMxFp4M3-5bwDD6EJhx3ypXHLkViul-V08CmQ1iZBPAT/exec?page=manager" class="btn manager" style="background-color: #d35400;">Open Manager App</a>

        <!-- Master Router Link -->
        <a href="https://script.google.com/macros/s/AKfycbwz-eVMRCO7Sd1dGIIVkHgmBXvfTxrbou5WX_lR2bIx3mKocZUAjWbqI_CuSy_dSw3-/exec" class="btn router">Open Master Router</a>

        <div style="font-size: 11px; color: #95a5a6; margin-top: 5px;">Guard @591 &bull; Resident @177 &bull; MasterRouter @26 (Universal Zero-Hardcoding Baseline)</div>
        <div id="status" style="margin-top: 15px; font-size: 12px; color: #7f8c8d;">Initializing system...</div>
    </div>

    <!-- Register the Service Worker for Web Push -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/visigate-push/firebase-messaging-sw.js')
            .then(function(registration) {
                document.getElementById('status').innerText = "Push Notifications Active";
                console.log('Registration successful, scope is:', registration.scope);
            }).catch(function(err) {
                document.getElementById('status').innerText = "Push Notifications Failed";
                console.log('Service worker registration failed, error:', err);
            });
        } else {
            document.getElementById('status').innerText = "Push not supported in this browser.";
        }
    </script>
</body>
</html>
